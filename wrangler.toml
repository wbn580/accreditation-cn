# wrangler.toml — Cloudflare Workers + Static Assets
name = "accreditation-cn"
main = "worker/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[observability]
enabled = true

# Custom domains will be added post-deploy:
# accreditation.cn — apex
# www.accreditation.cn — 301 redirect to apex

# 运行时文章层（R254，d1_runtime_scaffold 生成）。只存还没进构建产物的
# 新文章，静态正本优先。刻意不设 run_worker_first：Worker 只接管构建产物里
# 根本不存在的路径（云构建等价闸按 dist manifest 逐文件核 sha256）。
[[d1_databases]]
binding = "DB"
database_name = "accreditation-cn-content"
database_id = "0361eff4-135c-4135-96a3-facc88ada085"
